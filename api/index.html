<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Plant Finder</title>
    <link rel="stylesheet" href="style.css" >
</head>


<body>
    <header>
        <h1>Simple Plant Finder</h1>
        <p> A website powered by a REST API </p>
    </header>
    <main>

        <!-- SEARCH -->
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search for a plant...">
            <button onclick="searchPlants()"> Search </button>
            <button class="secondary" onclick="loadPlants()"> Show All </button>

        </section>

        <section>
            <h2>Plants</h2>
            <div id="plantList" class="plant-list">
                Loading plants...
            </div>
        </section>
    </main>

    <footer>
        <p> Data provided by the Simple Plant API </p>
    </footer>
    <script src="app.js"></script>
        <div id="plantModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</body>
</html>
